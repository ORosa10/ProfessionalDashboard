name: Job sourcing pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: job-sourcing
  cancel-in-progress: false

jobs:
  source-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Big Four career pages
        run: python -m sourcing.big4_pilot --max-pages 8
      - name: Persist sourcing results
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs.csv data/source_runs.csv
          if git diff --cached --quiet; then
            echo "No sourcing changes"
          else
            git commit -m "Refresh sourced jobs"
            git push
          fi
