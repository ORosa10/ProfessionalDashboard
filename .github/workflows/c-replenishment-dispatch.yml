name: C replenishment dispatcher

on:
  push:
    branches: [architecture-safe-migration]
    paths:
      - "data/semantic_fit.csv"
      - "data/semantic_fit_reviews/**"
      - "docs/C_SEMANTIC_THESIS.md"
      - "docs/C_WORK_CONTRACT.md"
      - ".github/workflows/c-replenishment-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start existing C replenishment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run architecture-replenishment-shadow.yml --repo ${{ github.repository }} --ref architecture-safe-migration
