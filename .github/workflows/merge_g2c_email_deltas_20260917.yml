name: Merge 2026-09-17 G to C email batch deltas

on:
  push:
    paths:
      - data/jobs_email_staging_delta_2026-09-17.csv
      - data/opportunity_registry_email_delta_2026-09-17.csv
      - data/semantic_fit_email_delta_2026-09-17.csv
      - .github/workflows/merge_g2c_email_deltas_20260917.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Merge verified email vacancies, identities and C verdicts
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          jobs = [
              (Path("data/jobs_email_staging.csv"), Path("data/jobs_email_staging_delta_2026-09-17.csv"), "job_id"),
              (Path("data/opportunity_registry.csv"), Path("data/opportunity_registry_email_delta_2026-09-17.csv"), "opportunity_id"),
              (Path("data/semantic_fit.csv"), Path("data/semantic_fit_email_delta_2026-09-17.csv"), "opportunity_id"),
          ]

          def merge(target, delta, key):
              with target.open(encoding="utf-8-sig", newline="") as f:
                  reader = csv.DictReader(f)
                  headers = reader.fieldnames or []
                  existing = {str(row.get(key, "")).strip() for row in reader}
              with delta.open(encoding="utf-8", newline="") as f:
                  additions = list(csv.DictReader(f))
              pending = []
              for item in additions:
                  value = str(item.get(key, "")).strip()
                  if value and value not in existing:
                      pending.append({field: item.get(field, "") for field in headers})
                      existing.add(value)
              if pending:
                  with target.open("a", encoding="utf-8", newline="") as f:
                      writer = csv.DictWriter(f, fieldnames=headers, lineterminator="\n")
                      writer.writerows(pending)

          for target, delta, key in jobs:
              merge(target, delta, key)

          with Path("data/jobs_email_staging.csv").open(encoding="utf-8-sig", newline="") as f:
              staging = list(csv.DictReader(f))
          with Path("data/opportunity_registry.csv").open(encoding="utf-8-sig", newline="") as f:
              registry_ids = {row["opportunity_id"] for row in csv.DictReader(f)}
          with Path("data/semantic_fit.csv").open(encoding="utf-8-sig", newline="") as f:
              fit_ids = {row["opportunity_id"] for row in csv.DictReader(f)}
          eligible = {
              row["job_id"] for row in staging
              if row.get("verification", "").startswith("verified email alert")
              and row.get("company")
              and len(row.get("description", "")) >= 80
              and row.get("job_url", "").startswith("http")
          }
          missing_registry = sorted(eligible - registry_ids)
          missing_fit = sorted(eligible - fit_ids)
          if missing_registry or missing_fit:
              raise SystemExit(f"Reconciliation failed: registry={missing_registry}; C={missing_fit}")
          print(f"Verified eligible: {len(eligible)}; missing registry: 0; missing C: 0")
          PY
          rm -f data/jobs_email_staging_delta_2026-09-17.csv
          rm -f data/opportunity_registry_email_delta_2026-09-17.csv
          rm -f data/semantic_fit_email_delta_2026-09-17.csv
          rm -f .github/workflows/merge_g2c_email_deltas_20260917.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs_email_staging.csv data/opportunity_registry.csv data/semantic_fit.csv
          git add data/jobs_email_staging_delta_2026-09-17.csv data/opportunity_registry_email_delta_2026-09-17.csv data/semantic_fit_email_delta_2026-09-17.csv
          git add .github/workflows/merge_g2c_email_deltas_20260917.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Run daily email alert G to C batch for 2026-09-17"
          git push
