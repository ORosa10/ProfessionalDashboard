        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          p = Path("data/opportunity_registry.csv")
          rows = list(csv.DictReader(p.open(encoding="utf-8", newline="")))
          fields = list(rows[0].keys()) if rows else ["opportunity_id","title","company","canonical_company_id","market","location","job_url","source_url","source_id","description","description_en","first_seen_at","last_seen_at","status"]
          ids = {r["opportunity_id"] for r in rows}
          for row in json.loads(os.environ["ROWS_JSON"]):
              if row["opportunity_id"] not in ids:
                  rows.append({k: row.get(k, "") for k in fields})
                  ids.add(row["opportunity_id"])
          with p.open("w", encoding="utf-8", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)
          PY
      - name: Commit registry and remove one-time workflow
