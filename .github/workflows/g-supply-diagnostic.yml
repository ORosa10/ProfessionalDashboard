name: G supply diagnostic

on:
  push:
    branches: [g-english-actionable-supply]
    paths:
      - ".github/workflows/g-supply-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Rebuild current C queue without scraping
        run: |
          python -m sourcing.build_semantic_fit_queue --limit 160 --out /tmp/semantic_fit_queue.csv
          python - <<'PY'
          import pandas as pd
          q = pd.read_csv('/tmp/semantic_fit_queue.csv').fillna('')
          print('FRESH C QUEUE BY MARKET')
          print(q.groupby('market').size().sort_values(ascending=False).to_string())
          print('\nFRESH C QUEUE BY MARKET + ROLE FAMILY')
          print(q.groupby(['market','role_family']).size().to_string())
          print('rows:', len(q))
          PY
