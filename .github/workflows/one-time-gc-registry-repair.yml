name: One-time G-C registry repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-gc-registry-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append validated opportunity identities
        env:
          REGISTRY_ROWS_B64: 
        run: |
          python - <<'PY'
          import base64
          import csv
          import io
          from pathlib import Path

          registry = Path("data/opportunity_registry.csv")
          staging = Path("data/jobs_email_staging.csv")
          semantic = Path("data/semantic_fit.csv")

          with registry.open(newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              fields = reader.fieldnames
              existing = {row["opportunity_id"] for row in reader}

          payload = base64.b64decode(__import__("os").environ["REGISTRY_ROWS_B64"]).decode("utf-8")
          parsed = list(csv.reader(io.StringIO(payload)))
          if len(parsed) != 21 or any(len(row) != len(fields) for row in parsed):
              raise SystemExit("Unexpected registry payload shape")

          records = [dict(zip(fields, row)) for row in parsed]
          new = [row for row in records if row["opportunity_id"] not in existing]
          if new:
              with registry.open("a", newline="", encoding="utf-8") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields, lineterminator="\n")
                  writer.writerows(new)

          expected = {row["opportunity_id"] for row in records}
          def ids(path, key):
              with path.open(newline="", encoding="utf-8-sig") as handle:
                  return {row[key] for row in csv.DictReader(handle)}

          registry_ids = ids(registry, "opportunity_id")
          staging_ids = ids(staging, "job_id")
          semantic_ids = ids(semantic, "opportunity_id")
          if not expected <= registry_ids:
              raise SystemExit("Registry identities remain missing")
          if not expected <= staging_ids or not expected <= semantic_ids:
              raise SystemExit("Staging or semantic rows are missing")
          print(f"Registry identities present: {len(expected)}; appended: {len(new)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-gc-registry-repair.yml
          git add data/opportunity_registry.csv
          git commit -m "Finalize 2026-10-12 G to C registry identities"
          git push origin HEAD:main
