name: Architecture D remote shadow checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "sourcing/remote_pilot.py"
      - "sourcing/test_remote_pilot.py"
      - "sourcing/build_actionability_shadow.py"
      - "sourcing/test_build_actionability_shadow.py"
      - "sourcing/aggregate_candidates_shadow.py"
      - "sourcing/build_semantic_fit_queue_shadow.py"
      - ".github/workflows/architecture-remote-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-remote-shadow
  cancel-in-progress: true

jobs:
  remote-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests

      - name: Run D regression tests
        run: |
          python -m unittest \
            sourcing.test_remote_pilot \
            sourcing.test_build_actionability_shadow \
            sourcing.test_aggregate_candidates_shadow

      - name: Fetch latest live D and learning references read-only
        run: |
          git fetch --no-tags origin main
          mkdir -p /tmp/remote-shadow-input /tmp/remote-shadow-output
          extract() {
            path="$1"
            out="$2"
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git show "origin/main:$path" > "/tmp/remote-shadow-input/$out"
            else
              : > "/tmp/remote-shadow-input/$out"
            fi
          }
          extract data/jobs_remote_staging.csv remote-live.csv
          extract data/semantic_fit.csv semantic-live.csv
          extract data/opportunity_history.csv history-live.csv

      - name: Refresh D sources with hardened branch runner in tmp only
        run: |
          python -m sourcing.remote_pilot \
            --out /tmp/remote-shadow-output/remote-refreshed.csv \
            --projects-out /tmp/remote-shadow-output/remote-projects-for-e.csv

      - name: Normalize current live D for migration regression
        run: |
          python -m sourcing.aggregate_candidates_shadow \
            --input remote=/tmp/remote-shadow-input/remote-live.csv \
            --out /tmp/remote-shadow-output/remote-live-candidates.csv

      - name: Normalize refreshed D through canonical candidate layer
        run: |
          python -m sourcing.aggregate_candidates_shadow \
            --input remote=/tmp/remote-shadow-output/remote-refreshed.csv \
            --out /tmp/remote-shadow-output/remote-candidates.csv \
            --diagnostics-out /tmp/remote-shadow-output/remote-diagnostics.csv

      - name: Build refreshed D to C pending semantic queue
        run: |
          python -m sourcing.build_semantic_fit_queue_shadow \
            --candidates /tmp/remote-shadow-output/remote-candidates.csv \
            --semantic /tmp/remote-shadow-input/semantic-live.csv \
            --history /tmp/remote-shadow-input/history-live.csv \
            --out /tmp/remote-shadow-output/remote-c-queue.csv \
            --limit 160

      - name: Evaluate refreshed D employability separately from C
        run: |
          python -m sourcing.build_actionability_shadow \
            --candidates /tmp/remote-shadow-output/remote-candidates.csv \
            --semantic /tmp/remote-shadow-input/semantic-live.csv \
            --policy data/actionability_policy_v1.json \
            --out /tmp/remote-shadow-output/remote-actionability.csv

          python -m sourcing.build_actionability_shadow \
            --candidates /tmp/remote-shadow-output/remote-live-candidates.csv \
            --semantic /tmp/remote-shadow-input/semantic-live.csv \
            --policy data/actionability_policy_v1.json \
            --out /tmp/remote-shadow-output/remote-live-actionability.csv

      - name: Verify explicit US-only remote roles cannot silently pass
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import pandas as pd

          def read(path):
              p = Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  return pd.DataFrame()
              try:
                  return pd.read_csv(p).fillna('')
              except pd.errors.EmptyDataError:
                  return pd.DataFrame()

          live = read('/tmp/remote-shadow-output/remote-live-candidates.csv')
          live_action = read('/tmp/remote-shadow-output/remote-live-actionability.csv')
          refreshed = read('/tmp/remote-shadow-output/remote-candidates.csv')
          refreshed_action = read('/tmp/remote-shadow-output/remote-actionability.csv')
          queue = read('/tmp/remote-shadow-output/remote-c-queue.csv')
          projects = read('/tmp/remote-shadow-output/remote-projects-for-e.csv')

          print(f'\nD refreshed permanent candidates: {len(refreshed)}')
          print(f'D explicit project/interim candidates separated for E: {len(projects)}')
          print(f'D pending C queue: {len(queue)}')

          if len(refreshed):
              report = refreshed[['job_id','company','title','market','location','source_id','source_streams']].merge(
                  refreshed_action[['opportunity_id','actionable','blockers','warnings']],
                  left_on='job_id', right_on='opportunity_id', how='left'
              )
              print('\n=== REFRESHED D REMOTE ACTIONABILITY ===')
              print(report.to_string(index=False))

          if len(projects):
              print('\n=== D -> E PROJECT CANDIDATES ===')
              print(projects[['company','title','location','source_id']].to_string(index=False))

          def explicit_us_mask(frame):
              if frame.empty:
                  return pd.Series(dtype=bool)
              return frame.apply(
                  lambda r: bool(re.search(
                      r'\bremote\s*[-–—,:()]\s*(?:the\s+)?(?:u\.?s\.?|united states)\b',
                      f"{r.get('location','')} {r.get('description_en','')} {r.get('description','')}",
                      flags=re.I,
                  )), axis=1,
              )

          # The current live snapshot is a migration regression baseline. At the
          # time this check was introduced it contained an Amwell Remote-US role.
          for label, frame, action in [
              ('live', live, live_action),
              ('refreshed', refreshed, refreshed_action),
          ]:
              mask = explicit_us_mask(frame)
              if not mask.any():
                  print(f'No explicit Remote-US role in {label} D snapshot.')
                  continue
              ids = set(frame.loc[mask, 'job_id'].astype(str))
              checked = action[action['opportunity_id'].astype(str).isin(ids)]
              bad = checked[~checked['blockers'].astype(str).str.contains('geography:remote_us_only', regex=False)]
              if len(bad):
                  raise SystemExit(f'Explicit Remote-US role in {label} D was not hard-blocked before J')
              print(f'Verified {len(checked)} explicit Remote-US role(s) in {label} D are hard-blocked before J.')
          PY

      - name: Upload D remote shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-d-remote-shadow
          path: |
            /tmp/remote-shadow-output/remote-refreshed.csv
            /tmp/remote-shadow-output/remote-projects-for-e.csv
            /tmp/remote-shadow-output/remote-live-candidates.csv
            /tmp/remote-shadow-output/remote-candidates.csv
            /tmp/remote-shadow-output/remote-diagnostics.csv
            /tmp/remote-shadow-output/remote-c-queue.csv
            /tmp/remote-shadow-output/remote-actionability.csv
            /tmp/remote-shadow-output/remote-live-actionability.csv
          retention-days: 7
