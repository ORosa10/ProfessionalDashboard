name: PR30 self-check

on:
  push:
    branches: [g-english-actionable-supply]
    paths:
      - ".github/workflows/pr30-self-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest sourcing.test_g_data_quality sourcing.test_company_targeting_promotion sourcing.test_sync_a_company_sources sourcing.test_sector_adapter_fallback sourcing.test_verify_live_j_links sourcing.test_board_catalog_adapters sourcing.test_queue_selection sourcing.test_g_query_profiles
      - run: python -m py_compile company_targeting_ui.py sourcing/g_data_quality.py sourcing/sync_a_company_sources.py sourcing/sector_pilot.py sourcing/verify_live_j_links.py sourcing/board_sweep_v2.py sourcing/board_catalog_adapters.py sourcing/build_semantic_fit_queue.py sourcing/queue_selection.py sourcing/g_query_profiles.py scripts/build_sector_sources.py
