name: One-shot J rerank now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-j-rerank-now.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start existing production C-to-J promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-core-pipeline.yml --repo ${{ github.repository }} --ref main
