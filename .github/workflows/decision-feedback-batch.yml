name: Build decision feedback batch

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: decision-feedback-batch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas

      - name: Build A/C/H decision batch
        run: python -m sourcing.build_decision_feedback_batch

      - name: Commit refreshed batch
        run: |
          if git diff --quiet -- data/decision_feedback_batch.csv; then
            echo "No decision-batch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decision_feedback_batch.csv
          git commit -m "Refresh batched decision feedback"
          git push
