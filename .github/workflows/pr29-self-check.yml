name: PR29 self-check

on:
  push:
    branches: [j-local-language-years-soft-rank]
    paths:
      - ".github/workflows/pr29-self-check.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas streamlit
      - run: python -m unittest sourcing.test_build_live_j_pool sourcing.test_j_soft_ranking
      - run: python -m py_compile action_queue_ui.py sourcing/build_live_j_pool.py sourcing/j_soft_ranking.py
