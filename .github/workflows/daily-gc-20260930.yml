name: Apply 2026-09-30 G-C batch
on:
  push:
    paths:
      - .github/daily_gc_20260930_payload.json
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate batch
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          payload=json.loads(Path(".github/daily_gc_20260930_payload.json").read_text(encoding="utf-8"))

          def read_csv(path):
              with open(path, newline="", encoding="utf-8-sig") as f:
                  rd=csv.DictReader(f)
                  return list(rd.fieldnames or []), list(rd)

          def write_csv(path, fields, rows):
              with open(path, "w", newline="", encoding="utf-8") as f:
                  wr=csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  wr.writeheader()
                  for row in rows:
                      wr.writerow({k: row.get(k, "") for k in fields})

          sp="data/jobs_email_staging.csv"
          sf, sr=read_csv(sp)
          by={r["job_id"]:r for r in sr}
          for row in payload["staging"]:
              jid=row["job_id"]
              if jid in by:
                  by[jid]["last_seen_at"]=row["last_seen_at"]
                  old=int(by[jid].get("duplicate_count") or 0)
                  by[jid]["duplicate_count"]=str(old+1)
              else:
                  clean={k:"" for k in sf}; clean.update(row); sr.append(clean); by[jid]=clean
          write_csv(sp,sf,sr)

          rp="data/opportunity_registry.csv"
          rf, rr=read_csv(rp)
          rid_col="opportunity_id" if "opportunity_id" in rf else "job_id"
          rids={r.get(rid_col,"") for r in rr}
          for row in payload["registry"]:
              oid=row["opportunity_id"]
              if oid not in rids:
                  clean={k:"" for k in rf}
                  aliases={
                    "opportunity_id":oid,"job_id":oid,"company":row["company"],"title":row["title"],
                    "job_url":row["job_url"],"canonical_url":row["job_url"],"url":row["job_url"],
                    "location":row["location"],"market":row["market"],"description":row["description"],
                    "source":row["source"],"source_id":row["source_id"],"canonical_company_id":row["canonical_company_id"],
                    "first_seen_at":row["first_seen_at"],"last_seen_at":row["last_seen_at"],
                    "created_at":row["created_at"],"updated_at":row["updated_at"],"status":"active"
                  }
                  clean.update({k:v for k,v in aliases.items() if k in rf})
                  rr.append(clean); rids.add(oid)
          write_csv(rp,rf,rr)

          fp="data/semantic_fit.csv"
          ff, fr=read_csv(fp)
          fids={r.get("opportunity_id","") for r in fr}
          for row in payload["fits"]:
              if row["opportunity_id"] not in fids:
                  clean={k:"" for k in ff}; clean.update(row); fr.append(clean); fids.add(row["opportunity_id"])
          write_csv(fp,ff,fr)

          def dupes(vals):
              seen=set(); d=set()
              for v in vals:
                  if v in seen: d.add(v)
                  seen.add(v)
              return d
          if dupes([r["job_id"] for r in sr]): raise SystemExit("duplicate staging job_id")
          if dupes([r["opportunity_id"] for r in fr]): raise SystemExit("duplicate semantic opportunity_id")
          if dupes([r.get(rid_col,"") for r in rr if r.get(rid_col,"")]): raise SystemExit("duplicate registry identity")
          rids={r.get(rid_col,"") for r in rr}
          fids={r["opportunity_id"] for r in fr}
          expected=set(payload["expected_ids"])
          if not expected <= set(r["job_id"] for r in sr): raise SystemExit("accepted vacancy missing staging")
          if not expected <= rids: raise SystemExit("accepted vacancy missing registry")
          if not expected <= fids: raise SystemExit("accepted vacancy missing C verdict")
          missing=[]
          for r in sr:
              if (r.get("verification") or "").startswith("verified email alert") and r.get("company") and len(r.get("description") or "")>=80 and (r.get("job_url") or "").startswith(("http://","https://")):
                  if r["job_id"] not in fids: missing.append(r["job_id"])
          if missing: raise SystemExit("recovery missing C verdicts: "+",".join(missing))
          print(json.dumps({"accepted":len(expected),"staging":len(sr),"registry":len(rr),"semantic":len(fr),"recovery_missing":0}))
          PY
      - name: Commit batch and remove transient files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/daily-gc-20260930.yml .github/daily_gc_20260930_payload.json
          git add data/jobs_email_staging.csv data/opportunity_registry.csv data/semantic_fit.csv
          git commit -m "Ingest and review 2026-09-30 email batch"
          git push origin main
