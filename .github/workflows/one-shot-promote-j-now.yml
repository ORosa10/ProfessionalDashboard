name: One-shot promote J now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-promote-j-now.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing production J promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-core-pipeline.yml --repo "$GITHUB_REPOSITORY" --ref main
