name: PE initial-calibration sourcing

# Keeps refreshing a full pool of Private Equity / private-markets candidates
# for a *not-yet-calibrated* sector -- same fetch depth as the Big Four /
# Consulting pilots (--max-pages 40), bounded only to the ~22 specific firms
# listed in data/job_sources_pe.csv (not an open-ended web crawl). Results
# stay in their own staging branch/files -- nothing here ever appears in a
# review queue automatically. A separate "diverse shortlist" layer (not yet
# built) will draw a reviewable sample from this pool, the same way
# build_calibration_batch.py did for Big Four.

on:
  workflow_dispatch:
  schedule:
    - cron: "57 4 * * *"
  push:
    branches:
      - main
    paths:
      - "sourcing/pe_pilot.py"
      - "sourcing/big4_pilot.py"
      - "data/job_sources_pe.csv"
      - "requirements.txt"
      - ".github/workflows/pe-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: pe-sourcing
  cancel-in-progress: false

jobs:
  source-pe-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check PE career pages
        run: python -m sourcing.pe_pilot --max-pages 40
      - name: Persist sourcing results to the staging branch
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs_pe_staging.csv data/source_runs_pe_staging.csv
          if git diff --cached --quiet; then
            echo "No sourcing changes"
            exit 0
          fi
          git commit -m "Refresh sourced PE jobs"
          for attempt in 1 2 3; do
            if git push --force origin HEAD:refs/heads/pe-sourcing-staging; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push sourcing results to pe-sourcing-staging after three attempts"
          exit 1
