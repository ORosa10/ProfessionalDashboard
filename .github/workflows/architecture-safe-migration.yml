name: Architecture safe migration checks

on:
  push:
    branches:
      - architecture-safe-migration
    paths:
      - "data/actionability_policy_v1.json"
      - "sourcing/aggregate_candidates_shadow.py"
      - "sourcing/test_aggregate_candidates_shadow.py"
      - "sourcing/compare_shadow_g.py"
      - "sourcing/test_compare_shadow_g.py"
      - "sourcing/build_semantic_fit_shadow.py"
      - "sourcing/test_build_semantic_fit_shadow.py"
      - "sourcing/build_semantic_fit_queue_shadow.py"
      - "sourcing/test_build_semantic_fit_queue_shadow.py"
      - "sourcing/build_actionability_shadow.py"
      - "sourcing/test_build_actionability_shadow.py"
      - "sourcing/build_j_shortlist_shadow.py"
      - "sourcing/test_build_j_shortlist_shadow.py"
      - "sourcing/compare_shadow_j.py"
      - "sourcing/test_compare_shadow_j.py"
      - ".github/workflows/architecture-safe-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-safe-migration-checks
  cancel-in-progress: true

jobs:
  shadow-migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Run shadow migration tests
        run: |
          python -m unittest \
            sourcing.test_aggregate_candidates_shadow \
            sourcing.test_compare_shadow_g \
            sourcing.test_build_semantic_fit_shadow \
            sourcing.test_build_semantic_fit_queue_shadow \
            sourcing.test_build_actionability_shadow \
            sourcing.test_build_j_shortlist_shadow \
            sourcing.test_compare_shadow_j

  shadow-snapshot-build:
    needs: shadow-migration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas

      - name: Fetch source snapshots read-only
        run: |
          # Read current source/reference branches without checking them out or
          # writing anything back. Missing/empty source files are diagnostics,
          # not permission to mutate production.
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/g-shadow-inputs /tmp/g-shadow-output

          extract() {
            ref="$1"
            path="$2"
            out="$3"
            if git cat-file -e "$ref:$path" 2>/dev/null; then
              git show "$ref:$path" > "/tmp/g-shadow-inputs/$out"
              echo "snapshot $ref:$path -> $out ($(wc -l < /tmp/g-shadow-inputs/$out) lines)"
            else
              : > "/tmp/g-shadow-inputs/$out"
              echo "snapshot missing: $ref:$path"
            fi
          }

          extract origin/main data/jobs_board_staging.csv board.csv
          extract origin/sourcing-staging data/jobs_staging.csv company.csv
          extract origin/pe-sourcing-staging data/jobs_pe_staging.csv pe.csv
          extract origin/consulting-sourcing-staging data/jobs_consulting_staging.csv consulting.csv
          extract origin/corporate-sourcing-staging data/jobs_corporate_staging.csv corporate.csv
          extract origin/financial-services-sourcing-staging data/jobs_financial-services_staging.csv financial-services.csv
          extract origin/holdings-sourcing-staging data/jobs_holdings_staging.csv holdings.csv
          extract origin/investment-banking-sourcing-staging data/jobs_investment-banking_staging.csv investment-banking.csv
          extract origin/public-markets-sourcing-staging data/jobs_public-markets_staging.csv public-markets.csv
          extract origin/specialist-funds-sourcing-staging data/jobs_specialist-funds_staging.csv specialist-funds.csv

          # Live references are read-only migration baselines, never source inputs.
          extract origin/main data/j_curated_shortlist.csv live-j.csv
          extract origin/main data/country_sourcing_weights.json country-targets.json
          extract origin/main data/semantic_fit.csv semantic-live.csv
          extract origin/main data/opportunity_history.csv history-live.csv

      - name: Build read-only shadow G candidate pool
        run: |
          python -m sourcing.aggregate_candidates_shadow \
            --input board=/tmp/g-shadow-inputs/board.csv \
            --input company=/tmp/g-shadow-inputs/company.csv \
            --input pe=/tmp/g-shadow-inputs/pe.csv \
            --input consulting=/tmp/g-shadow-inputs/consulting.csv \
            --input corporate=/tmp/g-shadow-inputs/corporate.csv \
            --input financial-services=/tmp/g-shadow-inputs/financial-services.csv \
            --input holdings=/tmp/g-shadow-inputs/holdings.csv \
            --input investment-banking=/tmp/g-shadow-inputs/investment-banking.csv \
            --input public-markets=/tmp/g-shadow-inputs/public-markets.csv \
            --input specialist-funds=/tmp/g-shadow-inputs/specialist-funds.csv \
            --out /tmp/g-shadow-output/candidates_shadow.csv \
            --diagnostics-out /tmp/g-shadow-output/g_shadow_diagnostics.csv

      - name: Compare shadow G with current live references
        run: |
          python -m sourcing.compare_shadow_g \
            --shadow /tmp/g-shadow-output/candidates_shadow.csv \
            --live-reference /tmp/g-shadow-inputs/live-j.csv \
            --country-targets /tmp/g-shadow-inputs/country-targets.json \
            --reference-out /tmp/g-shadow-output/live_j_coverage.csv \
            --country-out /tmp/g-shadow-output/country_raw_supply.csv

      - name: Build canonical semantic shadow store
        run: |
          python -m sourcing.build_semantic_fit_shadow \
            --canonical /tmp/g-shadow-inputs/semantic-live.csv \
            --curated-j /tmp/g-shadow-inputs/live-j.csv \
            --out /tmp/g-shadow-output/semantic_fit_shadow.csv

      - name: Build shadow C review queue
        run: |
          python -m sourcing.build_semantic_fit_queue_shadow \
            --candidates /tmp/g-shadow-output/candidates_shadow.csv \
            --semantic /tmp/g-shadow-output/semantic_fit_shadow.csv \
            --history /tmp/g-shadow-inputs/history-live.csv \
            --out /tmp/g-shadow-output/semantic_fit_queue_shadow.csv \
            --limit 160

      - name: Evaluate explicit pre-J actionability in shadow mode
        run: |
          python -m sourcing.build_actionability_shadow \
            --candidates /tmp/g-shadow-output/candidates_shadow.csv \
            --semantic /tmp/g-shadow-output/semantic_fit_shadow.csv \
            --policy data/actionability_policy_v1.json \
            --out /tmp/g-shadow-output/actionability_shadow.csv

      - name: Build Strong-only quota J shadow shortlist
        run: |
          python -m sourcing.build_j_shortlist_shadow \
            --candidates /tmp/g-shadow-output/candidates_shadow.csv \
            --semantic /tmp/g-shadow-output/semantic_fit_shadow.csv \
            --actionability /tmp/g-shadow-output/actionability_shadow.csv \
            --history /tmp/g-shadow-inputs/history-live.csv \
            --country-targets /tmp/g-shadow-inputs/country-targets.json \
            --out /tmp/g-shadow-output/j_shortlist_shadow.csv \
            --quota-out /tmp/g-shadow-output/j_country_quota_shadow.csv \
            --limit 20

      - name: Audit live J versus shadow J
        run: |
          python -m sourcing.compare_shadow_j \
            --live-j /tmp/g-shadow-inputs/live-j.csv \
            --candidates /tmp/g-shadow-output/candidates_shadow.csv \
            --semantic /tmp/g-shadow-output/semantic_fit_shadow.csv \
            --actionability /tmp/g-shadow-output/actionability_shadow.csv \
            --history /tmp/g-shadow-inputs/history-live.csv \
            --shadow-j /tmp/g-shadow-output/j_shortlist_shadow.csv \
            --live-report-out /tmp/g-shadow-output/live_j_to_shadow_audit.csv \
            --new-report-out /tmp/g-shadow-output/shadow_j_new_roles.csv

      - name: Print compact diagnostics
        run: |
          python - <<'PY'
          import pandas as pd

          d = pd.read_csv('/tmp/g-shadow-output/g_shadow_diagnostics.csv')
          print('\n=== G OVERALL ===')
          print(d[d.dimension.eq('overall')].to_string(index=False))
          print('\n=== G SOURCES ===')
          print(d[d.dimension.eq('source')].to_string(index=False))
          print('\n=== G COUNTRIES ===')
          print(d[d.dimension.eq('country')].to_string(index=False))

          ref = pd.read_csv('/tmp/g-shadow-output/live_j_coverage.csv')
          if len(ref):
            found = ref['found_in_shadow'].astype(str).str.lower().eq('true')
            print(f"\n=== LIVE J REFERENCE COVERAGE: {int(found.sum())}/{len(ref)} ===")
            missing = ref[~found][['curated_rank', 'company', 'title', 'market']]
            if len(missing):
              print(missing.to_string(index=False))

          country = pd.read_csv('/tmp/g-shadow-output/country_raw_supply.csv')
          print('\n=== RAW COUNTRY SUPPLY VS CONFIGURED TARGETS ===')
          print(country.to_string(index=False))

          sem = pd.read_csv('/tmp/g-shadow-output/semantic_fit_shadow.csv')
          if len(sem):
            print('\n=== C SEMANTIC SHADOW SOURCES ===')
            print(sem['semantic_source'].value_counts().to_string())

          queue = pd.read_csv('/tmp/g-shadow-output/semantic_fit_queue_shadow.csv')
          print(f"\n=== PENDING SHADOW C QUEUE: {len(queue)} ===")
          if len(queue):
            print(queue['country_bucket'].replace('', 'Other / Unresolved').value_counts().to_string())

          act = pd.read_csv('/tmp/g-shadow-output/actionability_shadow.csv')
          if len(act):
            actionable = act['actionable'].astype(str).str.lower().eq('true')
            print(f"\n=== ACTIONABILITY: {int(actionable.sum())}/{len(act)} PASS ===")
            blockers = act.loc[~actionable, 'blockers'].replace('', 'unspecified')
            if len(blockers):
              print(blockers.value_counts().head(20).to_string())

          j = pd.read_csv('/tmp/g-shadow-output/j_shortlist_shadow.csv')
          print(f"\n=== J SHADOW STRONG/ACTIONABLE: {len(j)} ===")
          if len(j):
            print(j[['priority_order', 'company', 'title', 'company_rating', 'country_bucket', 'selection_origin']].to_string(index=False))

          quotas = pd.read_csv('/tmp/g-shadow-output/j_country_quota_shadow.csv')
          print('\n=== J COUNTRY QUOTAS ===')
          print(quotas.to_string(index=False))

          audit = pd.read_csv('/tmp/g-shadow-output/live_j_to_shadow_audit.csv')
          print('\n=== LIVE J -> SHADOW J AUDIT ===')
          if len(audit):
            print(audit[['company', 'title', 'live_semantic_fit', 'shadow_semantic_fit', 'in_shadow_j', 'explanation']].to_string(index=False))

          new = pd.read_csv('/tmp/g-shadow-output/shadow_j_new_roles.csv')
          print(f"\n=== NEW SHADOW J ROLES: {len(new)} ===")
          if len(new):
            print(new.to_string(index=False))
          PY

      - name: Upload shadow diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-shadow-snapshot
          path: |
            /tmp/g-shadow-output/candidates_shadow.csv
            /tmp/g-shadow-output/g_shadow_diagnostics.csv
            /tmp/g-shadow-output/live_j_coverage.csv
            /tmp/g-shadow-output/country_raw_supply.csv
            /tmp/g-shadow-output/semantic_fit_shadow.csv
            /tmp/g-shadow-output/semantic_fit_queue_shadow.csv
            /tmp/g-shadow-output/actionability_shadow.csv
            /tmp/g-shadow-output/j_shortlist_shadow.csv
            /tmp/g-shadow-output/j_country_quota_shadow.csv
            /tmp/g-shadow-output/live_j_to_shadow_audit.csv
            /tmp/g-shadow-output/shadow_j_new_roles.csv
          retention-days: 7
