name: One-shot A-J flow patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-flow-patch-20260826.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Apply and validate flow patch
        run: python sourcing/one_shot_flow_patch_20260826.py
      - name: Commit production flow changes
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add \
            add_opportunity_ui.py \
            opportunity_history_ui.py \
            company_targeting_ui.py \
            sourcing/build_b_company_suggestions.py \
            sourcing/test_b_company_suggestions.py \
            sourcing/c_to_g_guidance.py \
            sourcing/test_c_to_g_guidance.py \
            sourcing/board_sweep_v2.py \
            .github/workflows/i-learning-sync.yml \
            .github/workflows/i-learning-quality.yml \
            .github/workflows/board-sourcing.yml \
            docs/C_TO_G_LEARNING_CONTRACT.md \
            data/c_to_g_sourcing_guidance.csv \
            data/a_b_discovered_companies.csv \
            data/workstream_health.json
          git commit -m "Wire B to A and establish safe C to G learning"
          git pull --rebase origin main
          git push origin HEAD:main
