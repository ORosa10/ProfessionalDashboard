name: Codex registry append 2026-10-01
on:
  push:
    paths:
      - .github/workflows/codex-registry-append-2026-10-01.yml
permissions:
  contents: write
jobs:
  append-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append validated opportunity identities
        env:
          ROWS_B64: 
        run: |
          python - <<'PY'
          import base64, csv, io, os
          path = "data/opportunity_registry.csv"
          payload = base64.b64decode(os.environ["ROWS_B64"]).decode("utf-8")
          incoming = list(csv.DictReader(io.StringIO("opportunity_id,title,company,canonical_company_id,market,location,job_url,source_url,source_id,description,description_en,first_seen_at,last_seen_at,status\n" + payload)))
          with open(path, "r", encoding="utf-8", newline="") as fh:
              existing = {row["opportunity_id"] for row in csv.DictReader(fh)}
          rows = [line for line in payload.splitlines(True) if next(csv.reader([line]))[0] not in existing]
          if rows:
              need_nl = os.path.getsize(path) and not open(path, "rb").read()[-1:].endswith(b"\n")
              with open(path, "a", encoding="utf-8", newline="") as fh:
                  if need_nl:
                      fh.write("\n")
                  fh.writelines(rows)
          appended = {next(csv.reader([line]))[0] for line in rows}
          missing = [row["opportunity_id"] for row in incoming if row["opportunity_id"] not in existing and row["opportunity_id"] not in appended]
          if missing:
              raise SystemExit(f"Missing registry rows: {missing}")
          PY
      - name: Commit registry identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunity_registry.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register email alert opportunities for 2026-10-01"
          git push
