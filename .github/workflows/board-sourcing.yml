name: Country board sourcing

# Workstream G: country/job-board retrieval. G is a source layer, not a second
# review inbox: downstream A/C enrichment will route retained roles to J.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "sourcing/board_sweep.py"
      - "sourcing/board_sweep_v2.py"
      - "sourcing/c_to_g_guidance.py"
      - "sourcing/test_c_to_g_guidance.py"
      - "data/c_to_g_sourcing_guidance.csv"
      - "docs/C_TO_G_LEARNING_CONTRACT.md"
      - "sourcing/build_semantic_fit_queue.py"
      - "sourcing/opportunity_registry.py"
      - "sourcing/g_data_quality.py"
      - "sourcing/validate_g_outputs.py"
      - "sourcing/test_g_data_quality.py"
      - "sourcing/filter_language_requirements.py"
      - "sourcing/test_filter_language_requirements.py"
      - "sourcing/board_html_adapters.py"
      - "sourcing/board_jobs_ch.py"
      - "sourcing/board_additional_adapters.py"
      - "sourcing/board_catalog_adapters.py"
      - "sourcing/board_jobly_fi.py"
      - "sourcing/board_nav_no.py"
      - "sourcing/board_jobbsafari_no.py"
      - "sourcing/board_academicwork.py"
      - "sourcing/board_thehub.py"
      - "sourcing/board_official_adapters.py"
      - "sourcing/test_board_html_adapters.py"
      - "sourcing/test_board_jobs_ch.py"
      - "sourcing/test_board_additional_adapters.py"
      - "sourcing/test_board_catalog_adapters.py"
      - "sourcing/test_board_jobly_fi.py"
      - "sourcing/test_board_nav_no.py"
      - "sourcing/test_board_jobbsafari_no.py"
      - "sourcing/test_board_academicwork.py"
      - "sourcing/test_board_thehub.py"
      - "sourcing/test_board_official_adapters.py"
      - "sourcing/requirements.txt"
      - "data/job_boards.csv"
      - "data/job_board_access_audit.csv"
      - "data/calibration_rules.json"
      - "data/country_sourcing_weights.json"
      - ".github/workflows/board-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: country-board-sourcing
  cancel-in-progress: true

jobs:
  source-country-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r sourcing/requirements.txt
      - name: Validate board adapter parsers
        run: python -m unittest sourcing.test_c_to_g_guidance sourcing.test_filter_language_requirements sourcing.test_opportunity_registry sourcing.test_g_data_quality sourcing.test_board_html_adapters sourcing.test_board_jobs_ch sourcing.test_board_additional_adapters sourcing.test_board_catalog_adapters sourcing.test_board_jobly_fi sourcing.test_board_nav_no sourcing.test_board_jobbsafari_no sourcing.test_board_academicwork sourcing.test_board_thehub sourcing.test_board_official_adapters
      - name: Deep full-country sourcing sweep
        run: python -m sourcing.board_sweep_v2 --no-translate --per-query 18 --max-details 160
      - name: Filter explicit language blockers before C and J
        run: python -m sourcing.filter_language_requirements
      - name: Validate G identity and vacancy quality
        run: python -m sourcing.validate_g_outputs --out data/g_quality_report.csv
      - name: Build broad pending C semantic-fit queue
        run: python -m sourcing.build_semantic_fit_queue --limit 160
      - name: Commit refreshed board roles to main
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs_board_staging.csv data/board_source_runs.csv data/semantic_fit_queue.csv data/opportunity_registry.csv data/g_quality_report.csv
          if git diff --cached --quiet; then echo "no board changes"; exit 0; fi
          git commit -m "Refresh deep country board sourced roles (workstream G)"
          for a in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((a * 5))
          done
          echo "board push failed"; exit 1
