name: Remote sourcing

# Workstream D: pull remote roles from public remote-board feeds and refresh
# data/jobs_remote_staging.csv. No company layer. Commits straight to main
# (fresh stream, nothing to disrupt) unlike the company-based sector pipelines.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - "sourcing/remote_pilot.py"
      - ".github/workflows/remote-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: remote-sourcing
  cancel-in-progress: false

jobs:
  source-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r sourcing/requirements.txt
      - name: Fetch remote roles
        run: python -m sourcing.remote_pilot --out data/jobs_remote_staging.csv
      - name: Commit refreshed remote roles to main
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs_remote_staging.csv
          if git diff --cached --quiet; then echo "no remote changes"; exit 0; fi
          git commit -m "Refresh remote sourced roles (workstream D)"
          for a in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((a * 5))
          done
          echo "remote push failed"; exit 1
