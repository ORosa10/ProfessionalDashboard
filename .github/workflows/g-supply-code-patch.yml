name: G supply code patch

on:
  push:
    branches: [g-english-actionable-supply]
    paths:
      - ".github/workflows/g-supply-code-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: g-english-actionable-supply
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch existing G/C files
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sourcing/build_semantic_fit_queue.py')
          s = p.read_text()
          needle = 'from .opportunity_registry import REGISTRY_COLUMNS, update_registry, validate_semantic_identity\n'
          repl = needle + 'from .queue_selection import select_country_balanced_indices\n'
          assert needle in s and 'from .queue_selection import' not in s
          s = s.replace(needle, repl, 1)
          start = s.index('    # First allocate C workload by the agreed country sourcing mix.')
          end = s.index('    queue = jobs.loc[chosen].copy()', start)
          s = s[:start] + '    targets = _target_slots(limit)\n    chosen = select_country_balanced_indices(jobs, limit, targets)\n\n' + s[end:]
          p.write_text(s)

          p = Path('sourcing/board_sweep_v2.py')
          s = p.read_text()
          needle = 'from sourcing.c_to_g_guidance import active_priority_queries\n'
          repl = needle + 'from sourcing.g_query_profiles import queries_for_country\n'
          assert needle in s and 'from sourcing.g_query_profiles import' not in s
          s = s.replace(needle, repl, 1)
          needle = '        try:\n            found, errors = _run_board(row, board_per_query, board_max_details, search_queries)\n'
          repl = '        board_queries = queries_for_country(search_queries, row.country)\n        try:\n            found, errors = _run_board(row, board_per_query, board_max_details, board_queries)\n'
          assert needle in s
          s = s.replace(needle, repl, 1)
          assert '"queries": len(search_queries),' in s
          s = s.replace('"queries": len(search_queries),', '"queries": len(board_queries),', 1)
          p.write_text(s)

          p = Path('sourcing/board_catalog_adapters.py')
          s = p.read_text()
          old = '"jobserve-uk": {"market": "United Kingdom", "base": "https://www.jobserve.com", "listing": "https://www.jobserve.com/gb/en/search-jobs-in-Greater-London%2C-London%2C-United-Kingdom/",'
          new = '"jobserve-uk": {"market": "United Kingdom", "base": "https://www.jobserve.com", "listing": "https://www.jobserve.com/gb/en/Finance%2C-Accounting%2BBanking-sector-jobs-in-United-Kingdom/",'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add sourcing/build_semantic_fit_queue.py sourcing/board_sweep_v2.py sourcing/board_catalog_adapters.py
          git commit -m "Improve English-actionable G supply and C queue balance"
          git push origin HEAD:g-english-actionable-supply
