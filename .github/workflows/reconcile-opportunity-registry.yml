name: Reconcile opportunity registry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile verified identities
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          registry_path = Path("data/opportunity_registry.csv")
          staging_path = Path("data/jobs_email_staging.csv")
          with registry_path.open(newline="", encoding="utf-8") as f:
              existing = {r["opportunity_id"] for r in csv.DictReader(f)}
          with staging_path.open(newline="", encoding="utf-8") as f:
              candidates = list(csv.DictReader(f))
          fields = ["opportunity_id","title","company","canonical_company_id","market","location","job_url","source_url","source_id","description","description_en","first_seen_at","last_seen_at","status"]
          new_rows = []
          for r in candidates:
              job_id = r["job_id"].strip()
              if job_id in existing or not r["verification"].startswith("verified email alert"):
                  continue
              if not r["company"].strip() or len(r["description"].strip()) < 80 or not r["job_url"].startswith("http"):
                  continue
              new_rows.append({
                  "opportunity_id": job_id,
                  "title": r["title"],
                  "company": r["company"],
                  "canonical_company_id": r["canonical_company_id"],
                  "market": r["market"],
                  "location": r["location"],
                  "job_url": r["job_url"],
                  "source_url": r["source_url"],
                  "source_id": r["source_id"],
                  "description": r["description"],
                  "description_en": r["description_en"],
                  "first_seen_at": r["discovered_at"],
                  "last_seen_at": r["last_seen_at"],
                  "status": r["status"] or "Active",
              })
          if new_rows:
              with registry_path.open("a", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writerows(new_rows)
          PY
          rm .github/workflows/reconcile-opportunity-registry.yml
          git config user.name "ProfessionalDashboard automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/opportunity_registry.csv .github/workflows/reconcile-opportunity-registry.yml
          if ! git diff --cached --quiet; then
            git commit -m "Complete 2026-09-26 G-to-C batch"
            git push
          fi
