name: GPT company-discovery

# Náhrada Cowork úlohy `company-discovery` pro svět bez Claude: volá OpenAI API
# (web search) a připojuje nové Unrated firmy do company_universe_wave*.csv.
# Vyžaduje repo secret OPENAI_API_KEY. Append-only (bezpečné).

on:
  schedule:
    - cron: "0 5 * * 1,4"   # pondělí a čtvrtek ráno
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Company discovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python automation_gpt/company_discovery.py
      - name: Commit
        run: |
          git config user.name "gpt-company-discovery[bot]"
          git config user.email "actions@github.com"
          git add data/company_universe_wave*.csv docs/WORKSTREAMS.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Discovery: nove Unrated firmy ($(date -u +%Y-%m-%d)) [gpt]"
            git push
          else
            echo "Nic noveho."
          fi
