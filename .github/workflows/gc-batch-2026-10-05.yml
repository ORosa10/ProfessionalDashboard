name: Complete G-to-C batch 2026-10-05

on:
  push:
    paths:
      - data/gc_batch_2026-10-05.json
      - .github/workflows/gc-batch-2026-10-05.yml

permissions:
  contents: write

concurrency:
  group: gc-batch-2026-10-05
  cancel-in-progress: false

jobs:
  append-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append registry identities and C verdicts
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from urllib.parse import urlparse

          payload_path = Path("data/gc_batch_2026-10-05.json")
          registry_path = Path("data/opportunity_registry.csv")
          semantic_path = Path("data/semantic_fit.csv")
          staging_path = Path("data/jobs_email_staging.csv")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))

          def read_rows(path):
              with path.open("r", encoding="utf-8", newline="") as handle:
                  reader = csv.DictReader(handle)
                  return list(reader), list(reader.fieldnames or [])

          def write_rows(path, fields, rows):
              with path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=fields, lineterminator="\n")
                  writer.writeheader()
                  writer.writerows(rows)

          registry, registry_fields = read_rows(registry_path)
          semantic, semantic_fields = read_rows(semantic_path)
          staging, _ = read_rows(staging_path)
          registry_ids = {row["opportunity_id"] for row in registry}
          semantic_ids = {row["opportunity_id"] for row in semantic}

          for row in payload["registry_rows"]:
              if row["opportunity_id"] not in registry_ids:
                  registry.append({field: row.get(field, "") for field in registry_fields})
                  registry_ids.add(row["opportunity_id"])

          for row in payload["semantic_rows"]:
              if row["opportunity_id"] not in registry_ids:
                  raise SystemExit(f"Missing registry identity before C verdict: {row['opportunity_id']}")
              if row["opportunity_id"] not in semantic_ids:
                  semantic.append({field: row.get(field, "") for field in semantic_fields})
                  semantic_ids.add(row["opportunity_id"])

          valid_fits = {"Strong", "Moderate", "Weak"}
          bad_fits = [row["opportunity_id"] for row in semantic if row.get("fit") not in valid_fits]
          if bad_fits:
              raise SystemExit(f"Invalid semantic fits: {bad_fits[:10]}")

          registry_ids = {row["opportunity_id"] for row in registry}
          missing_registry = [row["opportunity_id"] for row in semantic if row["opportunity_id"] not in registry_ids]
          if missing_registry:
              raise SystemExit(f"Semantic verdicts missing registry identity: {missing_registry[:10]}")

          recovery_missing = []
          for row in staging:
              verification = (row.get("verification") or "").lower()
              url = row.get("job_url") or ""
              parsed = urlparse(url)
              valid = (
                  verification.startswith("verified email alert")
                  and len(row.get("description") or "") >= 80
                  and bool(row.get("company"))
                  and parsed.scheme in {"http", "https"}
                  and bool(parsed.netloc)
              )
              if valid and row.get("job_id") not in semantic_ids:
                  recovery_missing.append(row.get("job_id"))
          if recovery_missing:
              raise SystemExit(f"Verified email alerts still missing C verdict: {recovery_missing}")

          batch_ids = {row["opportunity_id"] for row in payload["semantic_rows"]}
          if not batch_ids.issubset(registry_ids) or not batch_ids.issubset(semantic_ids):
              raise SystemExit("Current batch reconciliation failed")

          write_rows(registry_path, registry_fields, registry)
          write_rows(semantic_path, semantic_fields, semantic)
          print(json.dumps({
              "registry_rows": len(registry),
              "semantic_rows": len(semantic),
              "batch_rows": len(batch_ids),
              "recovery_missing": len(recovery_missing)
          }, indent=2))
          PY
      - name: Commit completed batch and remove one-off files
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git rm data/gc_batch_2026-10-05.json .github/workflows/gc-batch-2026-10-05.yml
          git add data/opportunity_registry.csv data/semantic_fit.csv
          git commit -m "Complete G-to-C email batch for 2026-10-05"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "G-to-C batch conflicts with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
