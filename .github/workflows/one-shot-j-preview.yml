name: One-shot J preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-j-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas streamlit
      - name: Print current J top 20
        run: |
          python - <<'PY'
          from action_queue_ui import _load_candidates, _merge_semantic, _company_context, _quality_and_rank, _select_top, _country_value
          jobs = _quality_and_rank(_company_context(_merge_semantic(_load_candidates())))
          top = _select_top(jobs, 20).copy()
          top['country'] = top.apply(_country_value, axis=1)
          print(top[['company','title','country','company_rating','_language_soft','_seniority_soft']].to_string(index=False))
          print('\nGerman-advert soft flags:', int(top['_language_soft'].sum()))
          print('Seniority soft penalty count:', int((top['_seniority_soft'] > 0).sum()))
          PY
