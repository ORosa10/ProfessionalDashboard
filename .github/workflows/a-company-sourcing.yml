name: A company career-page sourcing

# Sharded, checkpointed run for every enabled A company source.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * *"
  push:
    branches: [main]
    paths:
      - "sourcing/company_source_sweep.py"
      - "sourcing/company_source_sweep_shard.py"
      - "sourcing/merge_company_source_shards.py"
      - "sourcing/sync_a_company_sources.py"
      - "sourcing/big4_pilot.py"
      - "sourcing/pe_pilot.py"
      - "data/job_sources_*.csv"
      - ".github/workflows/a-company-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: a-company-sourcing
  cancel-in-progress: false

jobs:
  source-a-companies:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run company source shard
        run: |
          python -m sourcing.company_source_sweep_shard             --shard-index ${{ matrix.shard }}             --shards 8             --max-pages 30             --timeout-seconds 110             --output-dir "${{ runner.temp }}/company-source-shard-${{ matrix.shard }}"
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-source-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/company-source-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14

  merge-and-publish:
    if: always()
    needs: source-a-companies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download shard checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: company-source-shard-*
          path: shards
          merge-multiple: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Merge partial results
        run: python -m sourcing.merge_company_source_shards --shards-dir shards
      - name: Publish company roles and coverage telemetry
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs_company_staging.csv data/source_runs_company_staging.csv data/company_source_coverage.csv
          if git diff --cached --quiet; then
            echo "No company sourcing changes"
            exit 0
          fi
          git commit -m "Run sharded A company sourcing and record coverage"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "Company sourcing publish failed"
          exit 1
