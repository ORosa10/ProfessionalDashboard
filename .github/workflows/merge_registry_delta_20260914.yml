name: Merge 2026-09-14 opportunity registry delta

on:
  push:
    paths:
      - data/opportunity_registry_email_delta_2026-09-14.csv
      - .github/workflows/merge_registry_delta_20260914.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Merge identity rows
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          registry = Path("data/opportunity_registry.csv")
          delta = Path("data/opportunity_registry_email_delta_2026-09-14.csv")
          if not delta.exists():
              raise SystemExit(0)

          with registry.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              headers = reader.fieldnames or []
              rows = list(reader)
          if "opportunity_id" not in headers:
              raise SystemExit("Registry has no opportunity_id column")

          with delta.open(encoding="utf-8", newline="") as f:
              additions = list(csv.DictReader(f))

          existing = {str(row.get("opportunity_id", "")) for row in rows}
          for item in additions:
              oid = str(item.get("opportunity_id", "")).strip()
              if not oid or oid in existing:
                  continue
              rows.append({key: item.get(key, "") for key in headers})
              existing.add(oid)

          tmp = registry.with_suffix(".tmp")
          with tmp.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=headers, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          tmp.replace(registry)
          PY
          rm -f data/opportunity_registry_email_delta_2026-09-14.csv
          rm -f .github/workflows/merge_registry_delta_20260914.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunity_registry.csv data/opportunity_registry_email_delta_2026-09-14.csv .github/workflows/merge_registry_delta_20260914.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Merge 2026-09-14 email identities into opportunity registry"
          git push
