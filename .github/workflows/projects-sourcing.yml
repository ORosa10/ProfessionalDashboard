name: Projects sourcing

# Workstream E: paid project / interim / contract / freelance finance work.
# Reuses the remote-board fetchers but keeps only project-type roles. Commits
# straight to main (fresh stream). Tenders (TED/Vestnik) planned as channel 2.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"
  push:
    branches: [main]
    paths:
      - "sourcing/projects_pilot.py"
      - "sourcing/remote_pilot.py"
      - ".github/workflows/projects-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: projects-sourcing
  cancel-in-progress: false

jobs:
  source-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r sourcing/requirements.txt
      - name: Fetch project / interim roles
        run: python -m sourcing.projects_pilot --out data/jobs_projects_staging.csv
      - name: Commit refreshed project roles to main
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs_projects_staging.csv
          if git diff --cached --quiet; then echo "no project changes"; exit 0; fi
          git commit -m "Refresh sourced project/interim roles (workstream E)"
          for a in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((a * 5))
          done
          echo "projects push failed"; exit 1
