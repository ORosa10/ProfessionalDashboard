name: A and G quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - "company_targeting_ui.py"
      - "sourcing/g_data_quality.py"
      - "sourcing/test_g_data_quality.py"
      - "sourcing/test_company_targeting_promotion.py"
      - "sourcing/sync_a_company_sources.py"
      - "sourcing/company_source_sweep.py"
      - "sourcing/test_sync_a_company_sources.py"
      - "sourcing/sector_pilot.py"
      - "sourcing/test_sector_adapter_fallback.py"
      - "sourcing/verify_live_j_links.py"
      - "sourcing/test_verify_live_j_links.py"
      - "sourcing/board_sweep_v2.py"
      - "sourcing/board_catalog_adapters.py"
      - "sourcing/test_board_catalog_adapters.py"
      - "sourcing/build_semantic_fit_queue.py"
      - "sourcing/queue_selection.py"
      - "sourcing/test_queue_selection.py"
      - "sourcing/g_query_profiles.py"
      - "sourcing/test_g_query_profiles.py"
      - "sourcing/company_source_sweep_shard.py"
      - "sourcing/merge_company_source_shards.py"
      - "scripts/build_sector_sources.py"
      - ".github/workflows/a-g-quality-checks.yml"
      - ".github/workflows/a-company-sourcing.yml"
      - ".github/workflows/promote-core-pipeline.yml"
      - ".github/workflows/j-live-link-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m unittest             sourcing.test_g_data_quality             sourcing.test_company_targeting_promotion             sourcing.test_sync_a_company_sources             sourcing.test_sector_adapter_fallback             sourcing.test_verify_live_j_links             sourcing.test_board_catalog_adapters             sourcing.test_queue_selection             sourcing.test_g_query_profiles
      - name: Compile A/G modules
        run: |
          python -m py_compile             company_targeting_ui.py             sourcing/g_data_quality.py             sourcing/sync_a_company_sources.py             sourcing/sector_pilot.py             sourcing/verify_live_j_links.py             sourcing/board_sweep_v2.py             sourcing/board_catalog_adapters.py             sourcing/build_semantic_fit_queue.py             sourcing/queue_selection.py             sourcing/g_query_profiles.py             sourcing/company_source_sweep_shard.py             sourcing/merge_company_source_shards.py             scripts/build_sector_sources.py
