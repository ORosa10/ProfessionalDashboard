name: Architecture safe migration checks

on:
  push:
    branches:
      - architecture-safe-migration
    paths:
      - "sourcing/aggregate_candidates_shadow.py"
      - "sourcing/test_aggregate_candidates_shadow.py"
      - ".github/workflows/architecture-safe-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-safe-migration-checks
  cancel-in-progress: true

jobs:
  shadow-aggregator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Run shadow aggregator tests
        run: python -m unittest sourcing.test_aggregate_candidates_shadow

  shadow-aggregate-snapshots:
    needs: shadow-aggregator-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas

      - name: Fetch source snapshots read-only
        run: |
          # Read every current staging branch without checking it out or writing
          # anything back. Missing/empty sources are allowed and are diagnostic
          # information rather than a workflow failure.
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p /tmp/g-shadow-inputs /tmp/g-shadow-output

          extract() {
            ref="$1"
            path="$2"
            out="$3"
            if git cat-file -e "$ref:$path" 2>/dev/null; then
              git show "$ref:$path" > "/tmp/g-shadow-inputs/$out"
              echo "snapshot $ref:$path -> $out ($(wc -l < /tmp/g-shadow-inputs/$out) lines)"
            else
              : > "/tmp/g-shadow-inputs/$out"
              echo "snapshot missing: $ref:$path"
            fi
          }

          extract origin/main data/jobs_board_staging.csv board.csv
          extract origin/sourcing-staging data/jobs_staging.csv company.csv
          extract origin/pe-sourcing-staging data/jobs_pe_staging.csv pe.csv
          extract origin/consulting-sourcing-staging data/jobs_consulting_staging.csv consulting.csv
          extract origin/corporate-sourcing-staging data/jobs_corporate_staging.csv corporate.csv
          extract origin/financial-services-sourcing-staging data/jobs_financial-services_staging.csv financial-services.csv
          extract origin/holdings-sourcing-staging data/jobs_holdings_staging.csv holdings.csv
          extract origin/investment-banking-sourcing-staging data/jobs_investment-banking_staging.csv investment-banking.csv
          extract origin/public-markets-sourcing-staging data/jobs_public-markets_staging.csv public-markets.csv
          extract origin/specialist-funds-sourcing-staging data/jobs_specialist-funds_staging.csv specialist-funds.csv

      - name: Build read-only shadow candidate pool
        run: |
          python -m sourcing.aggregate_candidates_shadow \
            --input board=/tmp/g-shadow-inputs/board.csv \
            --input company=/tmp/g-shadow-inputs/company.csv \
            --input pe=/tmp/g-shadow-inputs/pe.csv \
            --input consulting=/tmp/g-shadow-inputs/consulting.csv \
            --input corporate=/tmp/g-shadow-inputs/corporate.csv \
            --input financial-services=/tmp/g-shadow-inputs/financial-services.csv \
            --input holdings=/tmp/g-shadow-inputs/holdings.csv \
            --input investment-banking=/tmp/g-shadow-inputs/investment-banking.csv \
            --input public-markets=/tmp/g-shadow-inputs/public-markets.csv \
            --input specialist-funds=/tmp/g-shadow-inputs/specialist-funds.csv \
            --out /tmp/g-shadow-output/candidates_shadow.csv \
            --diagnostics-out /tmp/g-shadow-output/g_shadow_diagnostics.csv

      - name: Print compact diagnostics
        run: |
          python - <<'PY'
          import pandas as pd
          p = '/tmp/g-shadow-output/g_shadow_diagnostics.csv'
          d = pd.read_csv(p)
          print('\n=== OVERALL ===')
          print(d[d.dimension.eq('overall')].to_string(index=False))
          print('\n=== SOURCES ===')
          print(d[d.dimension.eq('source')].to_string(index=False))
          print('\n=== COUNTRIES ===')
          print(d[d.dimension.eq('country')].to_string(index=False))
          PY

      - name: Upload shadow diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: g-shadow-snapshot
          path: |
            /tmp/g-shadow-output/candidates_shadow.csv
            /tmp/g-shadow-output/g_shadow_diagnostics.csv
          retention-days: 7
