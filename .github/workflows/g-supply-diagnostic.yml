name: G supply diagnostic

on:
  push:
    branches: [g-english-actionable-supply]
    paths:
      - ".github/workflows/g-supply-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Summarize current G to J supply
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from sourcing.j_soft_ranking import add_soft_rank_columns

          def load(path):
              p = Path(path)
              return pd.read_csv(p).fillna("") if p.exists() and p.stat().st_size else pd.DataFrame()

          g = load('data/jobs_board_staging.csv')
          if not g.empty:
              open_g = g[g['status'].eq('Open')].copy()
              open_g = add_soft_rank_columns(open_g)
              print('OPEN G BY MARKET')
              print(open_g.groupby('market').size().sort_values(ascending=False).to_string())
              print('\nOPEN G BY SOURCE')
              print(open_g.groupby(['market','source_id']).size().sort_values(ascending=False).to_string())
              print('\nOPEN G LOCAL-LANGUAGE SIGNAL BY MARKET')
              print(open_g.groupby('market')['_language_soft'].agg(['count','sum']).to_string())
          q = load('data/semantic_fit_queue.csv')
          if not q.empty:
              print('\nCURRENT C QUEUE BY MARKET')
              if 'market' in q.columns:
                  print(q.groupby('market').size().sort_values(ascending=False).to_string())
              print('C queue rows:', len(q))
          j = load('data/j_eligible_pool.csv')
          if not j.empty:
              j = add_soft_rank_columns(j)
              print('\nLIVE J POOL BY MARKET')
              print(j.groupby('market').size().sort_values(ascending=False).to_string())
              print('\nLIVE J POOL BY SOURCE')
              print(j.groupby(['market','source_id']).size().sort_values(ascending=False).to_string())
              print('\nLIVE J LOCAL-LANGUAGE SIGNAL BY MARKET')
              print(j.groupby('market')['_language_soft'].agg(['count','sum']).to_string())
              print('J pool rows:', len(j))
          PY
