name: G supply diagnostic

on:
  push:
    branches: [g-english-actionable-supply]
    paths:
      - ".github/workflows/g-supply-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r sourcing/requirements.txt
      - name: Unit and compile checks
        run: |
          python -m unittest sourcing.test_queue_selection sourcing.test_g_query_profiles sourcing.test_board_catalog_adapters
          python -m py_compile sourcing/queue_selection.py sourcing/g_query_profiles.py sourcing/build_semantic_fit_queue.py sourcing/board_sweep_v2.py sourcing/board_catalog_adapters.py
      - name: Rebuild current C queue without scraping
        run: |
          python -m sourcing.build_semantic_fit_queue --limit 160 --out /tmp/semantic_fit_queue.csv
          python - <<'PY'
          import pandas as pd
          q = pd.read_csv('/tmp/semantic_fit_queue.csv').fillna('')
          print('FRESH C QUEUE BY MARKET')
          print(q.groupby('market').size().sort_values(ascending=False).to_string())
          print('rows:', len(q))
          PY
      - name: Live JobServe finance catalogue check
        run: |
          python - <<'PY'
          from sourcing.board_catalog_adapters import discover_catalog_board
          jobs, errors = discover_catalog_board('jobserve-uk', [], 18, 160)
          print('JOBSERVE VERIFIED RELEVANT JOBS:', len(jobs))
          for job in jobs[:30]:
              print(job['title'], '|', job['company'], '|', job['job_url'])
          print('ERRORS:', errors[:20])
          if len(jobs) <= 1:
              raise SystemExit('JobServe finance catalogue did not improve UK supply')
          PY
