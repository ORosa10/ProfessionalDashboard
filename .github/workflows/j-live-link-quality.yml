name: J live-link quality

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: j-live-link-quality
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas requests

      - name: Test live-link classifier
        run: python -m unittest sourcing.test_verify_live_j_links

      - name: Revalidate current J pool
        run: |
          if [ ! -s data/j_eligible_pool.csv ]; then
            echo "No live J pool to verify"
            exit 0
          fi
          cp data/j_eligible_pool.csv /tmp/j_pool_before_links.csv
          if [ -s data/j_live_excluded.csv ]; then
            cp data/j_live_excluded.csv /tmp/j_excluded_before_links.csv
          else
            printf 'opportunity_id,company,title,excluded_reason\n' > /tmp/j_excluded_before_links.csv
          fi
          python -m sourcing.verify_live_j_links \
            --pool /tmp/j_pool_before_links.csv \
            --excluded /tmp/j_excluded_before_links.csv \
            --cache data/j_link_verification.csv \
            --out-pool data/j_eligible_pool.csv \
            --out-excluded data/j_live_excluded.csv \
            --out-cache data/j_link_verification.csv \
            --source-recent-hours 48 \
            --cache-hours 20 \
            --max-workers 8 \
            --timeout 12

      - name: Commit link-quality updates
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/j_eligible_pool.csv data/j_live_excluded.csv data/j_link_verification.csv
          if git diff --cached --quiet; then
            echo "No live-link changes"
            exit 0
          fi
          git commit -m "Refresh live J link quality"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Live-link refresh conflicts with newer main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push live-link refresh"
          exit 1
