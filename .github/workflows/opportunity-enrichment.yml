name: Opportunity enrichment

on:
  push:
    branches: [main]
    paths:
      - 'data/user_submitted_opportunities.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-enrichment-main
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Check enrichment API configuration
        id: api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; automatic B enrichment is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Research and enrich new B opportunities
        if: steps.api.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPPORTUNITY_ENRICHMENT_MODEL: gpt-5.4-mini
        run: python -m sourcing.run_manual_opportunity_enrichment --max-items 10

      - name: Commit enrichment
        if: steps.api.outputs.configured == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/user_submitted_opportunity_research.csv data/user_submitted_opportunities.csv; then
            echo "No enrichment changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/user_submitted_opportunity_research.csv data/user_submitted_opportunities.csv
          git commit -m "Auto-enrich submitted opportunities incl salary"
          git pull --rebase origin main
          git push origin HEAD:main
