name: Job sourcing pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "sourcing/**"
      - "personal_fit.py"
      - "data/job_sources_pilot.csv"
      - "requirements.txt"
      - ".github/workflows/job-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: job-sourcing
  cancel-in-progress: false

jobs:
  source-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test Big Four adapters
        run: python -m unittest sourcing.test_big4_pilot
      - name: Check career pages with personal-fit sourcing
        run: python -m sourcing.persona_sourcing --max-pages 40
      - name: Persist sourcing results
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs.csv data/source_runs.csv
          if git diff --cached --quiet; then
            echo "No sourcing changes"
          else
            git commit -m "Refresh sourced jobs"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Generated sourcing files conflict with newer main"
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Could not push sourcing results after three attempts"
            exit 1
          fi
