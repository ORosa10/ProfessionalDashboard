name: A and G quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - "company_targeting_ui.py"
      - "sourcing/g_data_quality.py"
      - "sourcing/test_g_data_quality.py"
      - "sourcing/test_company_targeting_promotion.py"
      - "sourcing/sync_a_company_sources.py"
      - "sourcing/test_sync_a_company_sources.py"
      - "sourcing/sector_pilot.py"
      - "sourcing/test_sector_adapter_fallback.py"
      - "sourcing/verify_live_j_links.py"
      - "sourcing/test_verify_live_j_links.py"
      - "scripts/build_sector_sources.py"
      - ".github/workflows/a-g-quality-checks.yml"
      - ".github/workflows/promote-core-pipeline.yml"
      - ".github/workflows/j-live-link-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m unittest \
            sourcing.test_g_data_quality \
            sourcing.test_company_targeting_promotion \
            sourcing.test_sync_a_company_sources \
            sourcing.test_sector_adapter_fallback \
            sourcing.test_verify_live_j_links
      - name: Compile A/G modules
        run: python -m py_compile company_targeting_ui.py sourcing/g_data_quality.py sourcing/sync_a_company_sources.py sourcing/sector_pilot.py sourcing/verify_live_j_links.py scripts/build_sector_sources.py
