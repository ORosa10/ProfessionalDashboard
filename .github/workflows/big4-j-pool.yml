name: Refresh J Big Four pool

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Job sourcing pilot"]
    types: [completed]
  schedule:
    - cron: "12 5 * * *"
  push:
    branches: [main]
    paths:
      - "data/jobs.csv"
      - "data/jobs_staging.csv"
      - "sourcing/build_big4_j_pool.py"
      - ".github/workflows/big4-j-pool.yml"

permissions:
  contents: write

concurrency:
  group: big4-j-pool
  cancel-in-progress: false

jobs:
  build:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Pull the completed sourcing snapshot
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin sourcing-staging
          git show origin/sourcing-staging:data/jobs_staging.csv > data/jobs_staging.csv
          git show origin/sourcing-staging:data/source_runs_staging.csv > data/source_runs_staging.csv
      - name: Build separate Big Four J pool
        run: python -m sourcing.build_big4_j_pool --input data/jobs.csv --input data/jobs_staging.csv --output data/j_big4_pool.csv
      - name: Build 36-cell Big Four source audit
        run: python -m sourcing.big4_source_audit --runs data/source_runs_staging.csv --output data/big4_source_audit.csv
      - name: Commit pool
        run: |
          if git diff --quiet -- data/j_big4_pool.csv data/big4_source_audit.csv; then echo "No Big Four pool changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/j_big4_pool.csv data/big4_source_audit.csv
          git commit -m "Refresh separate Big Four J pool"
          git restore -- data/jobs_staging.csv data/source_runs_staging.csv || true
          git pull --rebase origin main
          git push origin HEAD:main
