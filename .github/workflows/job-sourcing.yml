name: Job sourcing pilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - "sourcing/**"
      - "personal_fit.py"
      - "data/job_sources_pilot.csv"
      - "requirements.txt"
      - ".github/workflows/job-sourcing.yml"

permissions:
  contents: write

concurrency:
  group: job-sourcing
  cancel-in-progress: false

jobs:
  source-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test Big Four adapters
        run: python -m unittest sourcing.test_big4_pilot
      - name: Check career pages with personal-fit sourcing
        run: python -m sourcing.persona_sourcing --max-pages 40 --staging
      - name: Persist sourcing results to the staging branch
        run: |
          git config user.name "professional-dashboard-bot"
          git config user.email "professional-dashboard-bot@users.noreply.github.com"
          git add data/jobs_staging.csv data/source_runs_staging.csv
          if git diff --cached --quiet; then
            echo "No sourcing changes"
            exit 0
          fi
          git commit -m "Refresh sourced jobs"
          # This branch never touches main, so it never triggers a Streamlit
          # Community Cloud redeploy. It is always reset to "current main plus
          # today's staging snapshot" so it cannot accumulate merge conflicts.
          # New results only reach main (and the live Jobs review queue) via
          # the separate, manually-triggered "Promote staged jobs" workflow.
          for attempt in 1 2 3; do
            if git push --force origin HEAD:refs/heads/sourcing-staging; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push sourcing results to sourcing-staging after three attempts"
          exit 1
